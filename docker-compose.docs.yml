services:
  docs:
    image: studious_octo_goggles_local_docs
    container_name: studious_octo_goggles_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./studious_octo_goggles:/app/studious_octo_goggles:z
    ports:
      - '9000:9000'
    command: /start-docs
